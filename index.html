<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- Yap Games networking: peerjs must exist before the Unity loader runs, or
         YapPeerTransport.jslib reports "Peer is not defined" when hosting/joining.
         Living in the WebGL TEMPLATE means every build regenerates index.html WITH this line. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <!-- HTML task minigames (see tasks.js). Overlays the Unity canvas; no Unity UI needed. -->
    <link rel="stylesheet" href="tasks.css">
    <!-- Shared by every overlay below, so it MUST come first. -->
    <script src="common.js"></script>
    <script src="tasks.js"></script>
    <script src="meeting.js"></script>
    <script src="sabotage.js"></script>
    <script src="lobby.js"></script>
    <script src="browser.js"></script>
    <!-- Decides whether the keyboard goes to the game or to an HTML text box. Without it nothing
         the player types or presses ever reaches Unity. -->
    <script src="focus.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | MMC Among Us</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* The CONTAINER goes fullscreen (see the fullscreen button), so the canvas has to be told to
         fill it -- and the HTML overlays live in here with it, which is the whole point. */
      #unity-container:fullscreen,
      #unity-container:-webkit-full-screen {
        width: 100%;
        height: 100%;
        background: #000;
      }

      #unity-container:fullscreen #unity-canvas,
      #unity-container:-webkit-full-screen #unity-canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MMC Among Us</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/amoing us.loader.js";
      var config = {
        dataUrl: buildUrl + "/amoing us.data.unityweb",
        frameworkUrl: buildUrl + "/amoing us.framework.js.unityweb",
        codeUrl: buildUrl + "/amoing us.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MMC",
        productName: "MMC Among Us",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance; // lets tasks.js call SendMessage back into Unity
          loadingBar.style.display = "none";
          if (window.yapFocusGame) { window.yapFocusGame(); } // keys go to the game from the start
          fullscreenButton.onclick = () => {
            var request = container.requestFullscreen
                       || container.webkitRequestFullscreen
                       || container.msRequestFullscreen;

            if (request) {
              request.call(container);
            } else {
              unityInstance.SetFullscreen(1); // no element fullscreen here; overlays will be hidden
            }
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
